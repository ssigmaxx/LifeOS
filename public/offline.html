<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — LifeOS</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #171717;
        color: #ededed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0;
      }
      p {
        margin: 0;
        color: #a3a3a3;
        max-width: 28ch;
      }
      button {
        margin-top: 12px;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid #404040;
        background: transparent;
        color: #ededed;
        font-size: 0.875rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>You&rsquo;re offline</h1>
    <p>LifeOS needs a connection to load your data. Nothing was lost — just reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
