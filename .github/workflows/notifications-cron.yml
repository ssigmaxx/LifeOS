name: Notification reminders

# Vercel's Hobby plan only allows daily Cron Jobs, but reminders need to be
# checked every 15 minutes to fire near each user's configured time — so
# this workflow pings the same endpoint instead of using vercel.json's
# native cron (see /api/cron/notifications). Requires a repository secret
# CRON_SECRET matching the value set in the Vercel project's environment
# variables.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call notifications endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://lifeos-lake-delta.vercel.app/api/cron/notifications"
