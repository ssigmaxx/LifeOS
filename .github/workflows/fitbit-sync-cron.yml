name: Fitbit health sync

# Same pattern as notifications-cron.yml — Vercel's Hobby plan only allows
# daily native Cron Jobs, so this workflow pings the sync endpoint on its
# own schedule instead. Requires a repository secret CRON_SECRET matching
# the value set in the Vercel project's environment variables.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call fitbit-sync endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://lifeos-lake-delta.vercel.app/api/cron/fitbit-sync"
